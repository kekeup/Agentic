# AGENTIC_VSC System Configuration

system:
  name: "Agentic_VSC_System"
  version: "5.0"
  description: "Self-evolving Video Semantic Communication with Agentic AI"
  author: "System"
  date: "2025-01-12"

# OpenAI Configuration
openai:
  enabled: true  # 是否启用OpenAI
  api_key: "your-openai-key" 
  model: "gpt-4"  # 使用的模型
  temperature: 0.7  # 创造性
  max_tokens: 1000  # 最大响应长度

thresholds:
  mAP: 0.35                     # mAP < 35%触发报告
  snr_fluctuation: 3.0         # SNR波动 ≥ 3dB触发报告

# EWC (Elastic Weight Consolidation) Configuration
ewc:
  enabled: true  # 是否启用EWC
  importance: 1000.0  # 重要性权重（lambda参数）
  fisher_samples: 30  # Fisher矩阵计算样本数
  training_epochs: 5  # KITTI微调轮数
  batch_size: 8  # 训练批次大小


tools:
  enable_model_evaluation: true    
  enable_snr_measurement: true     
  enable_ewc_learning: true        
  enable_moe_gating: true          

# Agent Configuration
agents:
  cloud:
    enabled: true
    use_openai: true  # 是否使用OpenAI进行任务解析
    task_parsing_enabled: true
    
  edge:
    enabled: true
    evaluation_enabled: true
    real_detection_enabled: true
    
  embodied:
    enabled: true
    data_source: "kitti"  # 数据源：kitti或coco
    use_real_data: true

# Dataset Configuration
# 数据集配置
datasets:
  coco:
    path: "data/coco"
    vehicle_classes: [2, 3, 5, 7]  # COCO车辆类别ID
    img_size: 640
    
  kitti:
    path: "data/kitti"
    classes: ["car", "van", "truck", "pedestrian", "Person_sitting", "cyclist", "tram", "misc"]
    img_size: 640

# Model Configuration
models:
  coco_pretrained: "models/yolov8n.pt"  # 模型A: COCO预训练模型
  kitti_finetuned: "models/model_b_kitti_ewc.pt"  # 模型B: KITTI微调模型
  ewc_checkpoint_dir: "models/checkpoints"  # EWC检查点目录

# Path Configuration
paths:
  models_dir: "models"
  data_dir: "data"
  reports_dir: "reports"
  logs_dir: "logs"
  experiments_dir: "experiments"
  visualizations_dir: "data/visualization"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  console_output: true
  file_output: true
  log_file: "logs/system.log"

# Interface Configuration (SNR/MoE)
interfaces:
  snr:
    enabled: true
    implementation: "interface_only"  # interface_only 或 hardware
    threshold: 3.0  # SNR波动阈值
    
  moe:
    enabled: true
    implementation: "interface_only"  # interface_only 或 real_model
    num_experts: 2

# Training Configuration
training:
  device: "auto"  # auto, cuda, cpu
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10  # 早停耐心值

# Evaluation Configuration
evaluation:
  confidence_threshold: 0.25
  iou_threshold: 0.5
  max_detections: 100

reporting:
  trigger_on_mAP_low: true      # mAP<35%触发
  trigger_on_SNR_fluctuation: true  # SNR波动≥3dB触发
  generate_report_on_trigger: true  # 触发时生成报告
  send_to_cloud: true           # 发送报告到云代理